[package]
name = "maghemite-wasm-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.10.9"
rayon = "1.12.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "io-util", "io-std", "sync", "time"] }
wasmtime = { version = "=49.0.1", default-features = false, features = ["cache", "cranelift", "parallel-compilation", "component-model", "component-model-async", "runtime", "std", "async"] }
wasmtime-wasi = { version = "=49.0.1", default-features = false, features = ["p1", "p2", "p3"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
